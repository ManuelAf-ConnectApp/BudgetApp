[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-app"
version = "1.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist"]

[tool.ruff.lint]
# The existing application predates automated formatting. Keep CI focused on
# correctness errors while formatting is introduced incrementally.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
